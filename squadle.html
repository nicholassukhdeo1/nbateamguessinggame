<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Squadle</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0e0f11;
    --surface:   #17191d;
    --surface2:  #1f2228;
    --border:    #2a2d35;
    --orange:    #f97316;
    --orange-dim:#7c3910;
    --text:      #f0f0f0;
    --muted:     #6b7280;
    --green:     #22c55e;
    --green-bg:  #052e16;
    --red:       #ef4444;
    --red-bg:    #1f0909;
    --yellow:    #eab308;
    --yellow-bg: #1a1400;
    --radius:    10px;
  }

  html, body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 16px;
  }

  /* court line texture overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(249,115,22,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(249,115,22,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 0;
  }

  .page { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; padding: 0 20px 60px; }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 0 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 36px;
  }

  .logo {
    display: flex;
    flex-direction: column;
    line-height: 1;
  }

  .logo-word {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 48px;
    letter-spacing: -1px;
    color: var(--text);
  }

  .logo-word span { color: var(--orange); }

  .logo-tag {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-top: 2px;
  }

  .header-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }

  .guesses-track {
    display: flex;
    gap: 6px;
  }

  .g-pip {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--border);
    transition: background 0.4s;
  }
  .g-pip.miss { background: var(--red); }
  .g-pip.hit  { background: var(--green); }

  .guesses-label {
    font-size: 12px;
    color: var(--muted);
    font-family: 'Barlow Condensed', sans-serif;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* ── SEARCH ── */
  .search-section { margin-bottom: 32px; }

  .search-wrap {
    position: relative;
    display: flex;
    gap: 10px;
  }

  .search-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 18px;
    pointer-events: none;
  }

  #search-input {
    flex: 1;
    height: 54px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 16px;
    padding: 0 16px 0 44px;
    outline: none;
    transition: border-color 0.2s;
  }

  #search-input:focus { border-color: var(--orange); }
  #search-input::placeholder { color: var(--muted); }

  #guess-btn {
    height: 54px;
    padding: 0 28px;
    background: var(--orange);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }

  #guess-btn:hover  { background: #ea6c10; }
  #guess-btn:active { transform: scale(0.97); }
  #guess-btn:disabled { background: var(--border); color: var(--muted); cursor: default; }

  /* autocomplete */
  #suggestions {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    display: none;
    z-index: 100;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }

  .sug-item {
    padding: 12px 16px;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.1s;
    color: var(--text);
  }

  .sug-item:hover { background: var(--surface); color: var(--orange); }

  /* ── BANNER ── */
  #banner {
    display: none;
    padding: 16px 20px;
    border-radius: var(--radius);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin-bottom: 28px;
    animation: slideDown 0.3s ease;
  }

  #banner.win  { background: var(--green-bg); color: var(--green); border: 1px solid var(--green); }
  #banner.lose { background: var(--red-bg);   color: var(--red);   border: 1px solid var(--red);   }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── HINT TABLE HEADER ── */
  .hint-header {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr 1fr 1fr;
    gap: 6px;
    padding: 0 4px 10px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 10px;
  }

  .hint-header span {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
  }

  .hint-header span:first-child { text-align: left; }

  /* ── GUESS ROWS ── */
  #history { display: flex; flex-direction: column; gap: 8px; }

  .guess-row {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr 1fr 1fr;
    gap: 6px;
    animation: rowIn 0.35s ease;
  }

  @keyframes rowIn {
    from { opacity: 0; transform: translateX(-12px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .cell {
    border-radius: 8px;
    padding: 12px 8px;
    text-align: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.25;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 58px;
    letter-spacing: 0.3px;
  }

  .cell.name-cell {
    text-align: left;
    align-items: flex-start;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 15px;
  }

  .cell-arrow {
    font-size: 16px;
    margin-bottom: 2px;
  }

  .cell-val { font-size: 12px; }

  .c-correct { background: var(--green-bg);  color: var(--green);  border: 1px solid #14532d; }
  .c-wrong   { background: var(--red-bg);    color: var(--red);    border: 1px solid #450a0a; }
  .c-close   { background: var(--yellow-bg); color: var(--yellow); border: 1px solid #422006; }

  /* ── EMPTY SLOTS ── */
  .empty-slots { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }

  .empty-row {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr 1fr 1fr;
    gap: 6px;
    opacity: 0.35;
  }

  .empty-cell {
    height: 58px;
    border-radius: 8px;
    border: 1px dashed var(--border);
  }

  .slot-num {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    color: var(--muted);
  }

  /* ── LEGEND ── */
  .legend {
    display: flex;
    gap: 20px;
    margin-top: 32px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--muted);
  }

  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
  }
</style>
</head>
<body>
<div class="page">

  <header>
    <div class="logo">
      <div class="logo-word">Squad<span>le</span></div>
      <div class="logo-tag">NBA Team Guessing Game</div>
    </div>
    <div class="header-right">
      <div class="guesses-track" id="pips"></div>
      <div class="guesses-label" id="guesses-label">6 guesses remaining</div>
    </div>
  </header>

  <div id="banner"></div>

  <div class="search-section">
    <div class="search-wrap" id="search-wrap">
      <span class="search-icon">&#9679;</span>
      <input type="text" id="search-input" placeholder="Type an NBA team name..." autocomplete="off"/>
      <button id="guess-btn">Lock In</button>
      <div id="suggestions"></div>
    </div>
  </div>

  <div class="hint-header">
    <span>Team</span>
    <span>Conference</span>
    <span>Division</span>
    <span>Founded</span>
    <span>Rings</span>
    <span>Colors</span>
  </div>

  <div id="history"></div>
  <div class="empty-slots" id="empty-slots"></div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div> Correct</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--yellow)"></div> Close (warmer/colder)</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div> Wrong</div>
  </div>

</div>

<script>
const teams = [
  {name:"Atlanta Hawks",      conf:"East",div:"Southeast",primary:"Red",   secondary:"Yellow",champs:1, founded:1946},
  {name:"Boston Celtics",     conf:"East",div:"Atlantic", primary:"Green", secondary:"White", champs:17,founded:1946},
  {name:"Brooklyn Nets",      conf:"East",div:"Atlantic", primary:"Black", secondary:"White", champs:0, founded:1967},
  {name:"Charlotte Hornets",  conf:"East",div:"Southeast",primary:"Teal",  secondary:"Purple",champs:0, founded:1988},
  {name:"Chicago Bulls",      conf:"East",div:"Central",  primary:"Red",   secondary:"Black", champs:6, founded:1966},
  {name:"Cleveland Cavaliers",conf:"East",div:"Central",  primary:"Wine",  secondary:"Gold",  champs:1, founded:1970},
  {name:"Dallas Mavericks",   conf:"West",div:"Southwest",primary:"Blue",  secondary:"Silver",champs:1, founded:1980},
  {name:"Denver Nuggets",     conf:"West",div:"Northwest",primary:"Navy",  secondary:"Gold",  champs:2, founded:1967},
  {name:"Detroit Pistons",    conf:"East",div:"Central",  primary:"Red",   secondary:"Blue",  champs:3, founded:1941},
  {name:"Golden State Warriors",conf:"West",div:"Pacific",primary:"Gold",  secondary:"Blue",  champs:7, founded:1946},
  {name:"Houston Rockets",    conf:"West",div:"Southwest",primary:"Red",   secondary:"Silver",champs:2, founded:1967},
  {name:"Indiana Pacers",     conf:"East",div:"Central",  primary:"Navy",  secondary:"Gold",  champs:0, founded:1967},
  {name:"Los Angeles Clippers",conf:"West",div:"Pacific", primary:"Red",   secondary:"Blue",  champs:0, founded:1970},
  {name:"Los Angeles Lakers", conf:"West",div:"Pacific",  primary:"Purple",secondary:"Gold",  champs:17,founded:1947},
  {name:"Memphis Grizzlies",  conf:"West",div:"Southwest",primary:"Navy",  secondary:"Gold",  champs:0, founded:1995},
  {name:"Miami Heat",         conf:"East",div:"Southeast",primary:"Red",   secondary:"Black", champs:3, founded:1988},
  {name:"Milwaukee Bucks",    conf:"East",div:"Central",  primary:"Green", secondary:"Cream", champs:2, founded:1968},
  {name:"Minnesota Timberwolves",conf:"West",div:"Northwest",primary:"Navy",secondary:"Green",champs:0,founded:1989},
  {name:"New Orleans Pelicans",conf:"West",div:"Southwest",primary:"Navy", secondary:"Gold",  champs:0, founded:1988},
  {name:"New York Knicks",    conf:"East",div:"Atlantic", primary:"Blue",  secondary:"Orange",champs:2, founded:1946},
  {name:"Oklahoma City Thunder",conf:"West",div:"Northwest",primary:"Blue",secondary:"Orange",champs:1,founded:1967},
  {name:"Orlando Magic",      conf:"East",div:"Southeast",primary:"Blue",  secondary:"Black", champs:0, founded:1989},
  {name:"Philadelphia 76ers", conf:"East",div:"Atlantic", primary:"Blue",  secondary:"Red",   champs:3, founded:1946},
  {name:"Phoenix Suns",       conf:"West",div:"Pacific",  primary:"Purple",secondary:"Orange",champs:0,founded:1968},
  {name:"Portland Trail Blazers",conf:"West",div:"Northwest",primary:"Red",secondary:"Black", champs:1, founded:1970},
  {name:"Sacramento Kings",   conf:"West",div:"Pacific",  primary:"Purple",secondary:"Silver",champs:1, founded:1945},
  {name:"San Antonio Spurs",  conf:"West",div:"Southwest",primary:"Black", secondary:"Silver",champs:5, founded:1967},
  {name:"Toronto Raptors",    conf:"East",div:"Atlantic", primary:"Red",   secondary:"Black", champs:1, founded:1995},
  {name:"Utah Jazz",          conf:"West",div:"Northwest",primary:"Navy",  secondary:"Yellow",champs:0, founded:1974},
  {name:"Washington Wizards", conf:"East",div:"Southeast",primary:"Navy",  secondary:"Red",   champs:1, founded:1961},
];

const answer = teams[Math.floor(Math.random() * teams.length)];
let guessesLeft = 6;
let usedGuesses = 0;
let gameOver = false;

// build pips
const pipsEl = document.getElementById('pips');
for (let i = 0; i < 6; i++) {
  const p = document.createElement('div');
  p.className = 'g-pip';
  p.id = 'pip-' + i;
  pipsEl.appendChild(p);
}

// build empty slots
function buildEmptySlots(count) {
  const el = document.getElementById('empty-slots');
  el.innerHTML = '';
  for (let i = 0; i < count; i++) {
    const row = document.createElement('div');
    row.className = 'empty-row';
    const numCell = document.createElement('div');
    numCell.className = 'empty-cell slot-num';
    numCell.textContent = usedGuesses + i + 1;
    row.appendChild(numCell);
    for (let j = 0; j < 5; j++) {
      const c = document.createElement('div');
      c.className = 'empty-cell';
      row.appendChild(c);
    }
    el.appendChild(row);
  }
}

buildEmptySlots(6);

function updateLabel() {
  document.getElementById('guesses-label').textContent =
    guessesLeft === 1 ? '1 guess remaining' : guessesLeft + ' guesses remaining';
}

function makeCell(cls, arrow, val) {
  const c = document.createElement('div');
  c.className = 'cell ' + cls;
  if (arrow) {
    const a = document.createElement('div');
    a.className = 'cell-arrow';
    a.textContent = arrow;
    c.appendChild(a);
  }
  const v = document.createElement('div');
  v.className = 'cell-val';
  v.textContent = val;
  c.appendChild(v);
  return c;
}

function submitGuess() {
  if (gameOver) return;
  const input = document.getElementById('search-input');
  const val = input.value.trim();
  if (!val) return;

  const guessed = teams.find(t => t.name.toLowerCase() === val.toLowerCase());
  if (!guessed) {
    input.style.borderColor = 'var(--red)';
    setTimeout(() => input.style.borderColor = 'var(--border)', 700);
    return;
  }

  const won = guessed.name === answer.name;
  guessesLeft--;
  const pip = document.getElementById('pip-' + usedGuesses);
  if (pip) pip.className = 'g-pip ' + (won ? 'hit' : 'miss');
  usedGuesses++;
  updateLabel();
  buildEmptySlots(Math.max(0, guessesLeft));

  const row = document.createElement('div');
  row.className = 'guess-row';

  // name cell
  const nameCell = document.createElement('div');
  nameCell.className = 'cell name-cell';
  nameCell.textContent = guessed.name;
  row.appendChild(nameCell);

  // conference
  row.appendChild(makeCell(
    guessed.conf === answer.conf ? 'c-correct' : 'c-wrong',
    null,
    guessed.conf === answer.conf ? '✓ ' + answer.conf : answer.conf
  ));

  // division
  row.appendChild(makeCell(
    guessed.div === answer.div ? 'c-correct' : 'c-wrong',
    null,
    guessed.div === answer.div ? '✓ ' + answer.div : answer.div
  ));

  // founded
  const fDiff = answer.founded - guessed.founded;
  row.appendChild(makeCell(
    fDiff === 0 ? 'c-correct' : 'c-close',
    fDiff === 0 ? null : fDiff > 0 ? '▲' : '▼',
    fDiff === 0 ? '✓ ' + answer.founded : guessed.founded
  ));

  // champs
  const cDiff = answer.champs - guessed.champs;
  row.appendChild(makeCell(
    cDiff === 0 ? 'c-correct' : 'c-close',
    cDiff === 0 ? null : cDiff > 0 ? '▲' : '▼',
    cDiff === 0 ? '✓ ' + answer.champs : guessed.champs
  ));

  // colors
  const pm = guessed.primary === answer.primary;
  const sm = guessed.secondary === answer.secondary;
  row.appendChild(makeCell(
    pm && sm ? 'c-correct' : (pm || sm) ? 'c-close' : 'c-wrong',
    null,
    pm && sm ? 'Both ✓' : pm ? 'Primary ✓' : sm ? 'Secondary ✓' : 'Neither'
  ));

  const history = document.getElementById('history');
  history.insertBefore(row, history.firstChild);

  input.value = '';
  document.getElementById('suggestions').style.display = 'none';

  const banner = document.getElementById('banner');
  if (won) {
    gameOver = true;
    banner.className = 'win';
    banner.textContent = '🏆 Correct! The answer was ' + answer.name + '. Nice work.';
    banner.style.display = 'block';
    document.getElementById('guess-btn').disabled = true;
    document.getElementById('search-input').disabled = true;
  } else if (guessesLeft === 0) {
    gameOver = true;
    banner.className = 'lose';
    banner.textContent = 'Out of guesses. The answer was ' + answer.name + '.';
    banner.style.display = 'block';
    document.getElementById('guess-btn').disabled = true;
    document.getElementById('search-input').disabled = true;
  }
}

// autocomplete
const searchInput = document.getElementById('search-input');
const sugBox = document.getElementById('suggestions');

searchInput.addEventListener('input', () => {
  const q = searchInput.value.toLowerCase();
  if (!q) { sugBox.style.display = 'none'; return; }
  const matches = teams.filter(t => t.name.toLowerCase().includes(q)).slice(0, 7);
  if (!matches.length) { sugBox.style.display = 'none'; return; }
  sugBox.innerHTML = '';
  matches.forEach(t => {
    const item = document.createElement('div');
    item.className = 'sug-item';
    item.textContent = t.name;
    item.addEventListener('mousedown', () => {
      searchInput.value = t.name;
      sugBox.style.display = 'none';
    });
    sugBox.appendChild(item);
  });
  sugBox.style.display = 'block';
});

searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') submitGuess();
  if (e.key === 'Escape') sugBox.style.display = 'none';
});

searchInput.addEventListener('blur', () => setTimeout(() => sugBox.style.display = 'none', 150));
document.getElementById('guess-btn').addEventListener('click', submitGuess);
</script>
</body>
</html>
